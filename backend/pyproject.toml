[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bodyos-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary]>=3.2",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "tzdata>=2024.1",
  "python-multipart>=0.0.9",
  # AI vendor SDKs; each is imported only when AI_PROVIDER selects it.
  "anthropic>=1.11",
  "google-genai>=2.28",
  # MCP server and its OAuth endpoints, for connecting Claude and other AI assistants.
  "mcp>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The formatter enforces line length; long string literals are allowed.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
