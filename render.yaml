services:
  - type: web
    name: bodyos-api
    runtime: python
    plan: free
    rootDir: backend
    # Both AI SDKs are installed so switching vendor is only an env var change.
    buildCommand: pip install ".[ai-anthropic,ai-google]"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: USDA_API_KEY
        sync: false
      - key: OFF_USER_AGENT
        value: "BodyOS/0.2 (personal nutrition tracker)"
      - key: FOOD_SOURCES
        value: live
      - key: AI_PROVIDER
        value: none
      - key: AI_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
